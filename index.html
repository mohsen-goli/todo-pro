<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo Pro</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <main class="app">
      <h1>Todo Pro</h1>

      <form id="todo-form">
        <input id="todo-input" type="text" placeholder="Add a task..." />

        <select id="priority-input">
          <option value="high">🔴 High</option>
          <option value="medium" selected>🟡 Medium</option>
          <option value="low">🟢 Low</option>
        </select>

        <button type="submit">Add</button>
      </form>
      <input id="search-input" type="text" placeholder="Search tasks..." />
      <p id="todo-count">0 Tasks</p>
      <p id="completed-count">0 Completed</p>
      <button id="clear-all">Clear All</button>
      <button id="theme-toggle" type="button">🌙 Dark Mode</button>
      <div class="filters">
        <button type="button" data-filter="all">All</button>
        <button type="button" data-filter="active">Active</button>
        <button type="button" data-filter="completed">Completed</button>
      </div>
      <select id="sort-input">
        <option value="newest">Newest</option>
        <option value="oldest">Oldest</option>
        <option value="high">High Priority</option>
        <option value="low">Low Priority</option>
      </select>
      <div class="table-container">
        <table>
          <thead>
            <thead>
              <tr>
                <th>Task</th>
                <th>Priority</th>
                <th>Status</th>
                <th>Actions</th>
              </tr>
            </thead>
          </thead>

          <tbody id="todo-list"></tbody>
        </table>
      </div>
    </main>

    <script src="script.js"></script>
  </body>
</html>
