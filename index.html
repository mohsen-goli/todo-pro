<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo Pro</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <main class="app">
      <h1>Todo Pro</h1>

      <form id="todo-form">
        <input id="todo-input" type="text" placeholder="Add a task..." />

        <button type="submit">Add</button>
      </form>
      <input id="search-input" type="text" placeholder="Search tasks..." />
      <p id="todo-count">0 Tasks</p>
      <p id="completed-count">0 Completed</p>
      <button id="clear-all">Clear All</button>
      <button id="theme-toggle" type="button">🌙 Dark Mode</button>
      <div class="filters">
        <button type="button" data-filter="all">All</button>
        <button type="button" data-filter="active">Active</button>
        <button type="button" data-filter="completed">Completed</button>
      </div>
      <ul id="todo-list"></ul>
    </main>

    <script src="script.js"></script>
  </body>
</html>
